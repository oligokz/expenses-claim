<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Claim Portal</title>
    <!-- Tailwind CSS via CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-700 p-6 text-white">
            <h2 class="text-2xl font-bold">New Expense Claim</h2>
            <p class="text-blue-100 text-sm mt-1">Submit your receipts and itemize your expenses below.</p>
        </div>

        <form id="expenseForm" class="p-6 md:p-8" onsubmit="handleFormSubmit(event)">
            
            <!-- SECTION 1: Parent Details -->
            <h3 class="text-lg font-semibold text-gray-800 border-b pb-2 mb-4">1. Employee Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Employee Name</label>
                    <input type="text" id="employeeName" required class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Employee Email</label>
                    <input type="email" id="employeeEmail" required placeholder="For status updates" class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date of Expense</label>
                    <input type="date" id="claimDate" required class="w-full p-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- SECTION 2: Receipt Upload -->
            <h3 class="text-lg font-semibold text-gray-800 border-b pb-2 mb-4">2. Receipt Documentation</h3>
            <div class="mb-8 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg">
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload Receipt Image or PDF</label>
                <input type="file" id="receiptFile" accept="image/*,application/pdf" required class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer">
            </div>

            <!-- SECTION 3: Dynamic Line Items -->
            <div class="flex justify-between items-end border-b pb-2 mb-4">
                <h3 class="text-lg font-semibold text-gray-800">3. Itemized Breakdown</h3>
                <button type="button" onclick="addItemRow()" class="bg-gray-800 hover:bg-gray-900 text-white px-3 py-1.5 rounded-md text-sm font-medium transition-colors">
                    + Add Item
                </button>
            </div>
            
            <div class="overflow-x-auto mb-8 border border-gray-200 rounded-lg">
                <table class="w-full text-left border-collapse" id="itemsTable">
                    <thead>
                        <tr class="bg-gray-50 text-gray-700 text-sm font-semibold border-b border-gray-200">
                            <th class="p-3 w-1/4">Category</th>
                            <th class="p-3 w-32">Currency</th>
                            <th class="p-3 w-32">Amount</th>
                            <th class="p-3">Description</th>
                            <th class="p-3 w-12 text-center">Del</th>
                        </tr>
                    </thead>
                    <tbody id="itemRows" class="divide-y divide-gray-200">
                        <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end pt-4">
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-lg shadow-md transition-colors text-lg">
                    Submit to Manager
                </button>
            </div>
            
            <!-- Success/Error Message Container -->
            <div id="statusMessage" class="hidden mt-4 p-4 rounded-md font-medium text-center"></div>

        </form>
    </div>

    <script>
        const categories = ["Travel", "Meals", "Office Supplies", "Software", "Client Relations"];
        const currencies = ["SGD", "USD", "EUR", "GBP", "AUD"];

        // Start with one row
        window.onload = () => addItemRow();

        function addItemRow() {
            const tbody = document.getElementById('itemRows');
            const rowId = 'row-' + Date.now();
            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.className = "hover:bg-gray-50";

            tr.innerHTML = `
                <td class="p-2">
                    <select required class="w-full p-2 border border-gray-300 rounded-md outline-none focus:border-blue-500 bg-white">
                        ${categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                </td>
                <td class="p-2">
                    <select required class="w-full p-2 border border-gray-300 rounded-md outline-none focus:border-blue-500 bg-white">
                        ${currencies.map(c => `<option value="${c}">${c}</option>`).join('')}
                    </select>
                </td>
                <td class="p-2">
                    <input type="number" step="0.01" min="0.01" required placeholder="0.00" class="w-full p-2 border border-gray-300 rounded-md outline-none focus:border-blue-500">
                </td>
                <td class="p-2">
                    <input type="text" required placeholder="What was this for?" class="w-full p-2 border border-gray-300 rounded-md outline-none focus:border-blue-500">
                </td>
                <td class="p-2 text-center">
                    <button type="button" onclick="deleteRow('${rowId}')" class="text-red-500 hover:text-red-700 font-bold text-xl">&times;</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function deleteRow(rowId) {
            if (document.getElementById('itemRows').rows.length > 1) {
                document.getElementById(rowId).remove();
            } else {
                alert("You need at least one line item.");
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault(); // Stop page reload
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                // 1. Package the file and parent data
                const formData = new FormData();
                formData.append("employeeName", document.getElementById('employeeName').value);
                formData.append("employeeEmail", document.getElementById('employeeEmail').value);
                formData.append("claimDate", document.getElementById('claimDate').value);
                formData.append("receipt", document.getElementById('receiptFile').files[0]);

                // 2. Loop through table and package the line items as JSON
                const items = [];
                const rows = document.getElementById('itemRows').rows;
                for (let i = 0; i < rows.length; i++) {
                    const inputs = rows[i].querySelectorAll('select, input');
                    items.push({
                        category: inputs[0].value,
                        currency: inputs[1].value,
                        amount: parseFloat(inputs[2].value),
                        description: inputs[3].value
                    });
                }
                formData.append("lineItems", JSON.stringify(items));

                // FOR TESTING: Log what we are sending
                console.log("Data ready for Power Automate:", Object.fromEntries(formData.entries()));
                alert("Check your browser console to see the data payload! (F12)");

                // THE REAL API CALL (Uncomment when you have the Power Automate URL)
                /*
                const response = await fetch('YOUR_POWER_AUTOMATE_WEBHOOK_URL', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Server error");
                */

                // Success UI
                statusMsg.className = "mt-4 p-4 rounded-md font-medium text-center bg-green-100 text-green-800 block";
                statusMsg.innerText = "Claim submitted successfully!";
                document.getElementById('expenseForm').reset();
                
            } catch (error) {
                statusMsg.className = "mt-4 p-4 rounded-md font-medium text-center bg-red-100 text-red-800 block";
                statusMsg.innerText = "Error submitting claim. Please try again.";
            } finally {
                btn.innerText = "Submit to Manager";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
